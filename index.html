<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hub Direita — Munição | Flávio × Lula</title>
  <meta name="description" content="Hub local de munição política — 2º turno Flávio Bolsonaro vs Lula até 25/10/2026" />
  <style>
    :root {
      --bg: #0b0b0b;
      --bg-elev: #121212;
      --bg-card: #161616;
      --bg-card-hover: #1c1c1c;
      --border: #2a2a2a;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --green: #00c853;
      --green-dim: #00a844;
      --gold: #d4a017;
      --gold-dim: #b8860b;
      --red: #e53935;
      --red-dim: #c62828;
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Ubuntu, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, #0f0f0f 0%, rgba(11,11,11,0.96) 100%);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px 0;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .brand-left h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--green), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-left .sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    .badge-runoff {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-runoff .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s ease-in-out infinite;
    }
